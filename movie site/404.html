<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lost in the Abyss | RUIN.TO</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#050505">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&family=Montserrat:wght@500;700&display=swap" rel="stylesheet">
  <!--
    GitHub Pages shows this file for ANY address that does not exist, at the address the visitor typed
    (e.g. /my-repo/some/wrong/page). Relative links such as style.css would therefore break, so this page is
    fully self-contained: its styles are inline and its links are computed below.
  -->
  <style>
    :root { --blood-red: #da0000; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center;
      background: #050505 center / cover no-repeat; color: #fff; font-family: 'Montserrat', sans-serif; padding: 24px;
    }
    body::before { content: ''; position: fixed; inset: 0; background: radial-gradient(circle at center, rgba(5,5,5,.55), #050505 80%); }
    main { position: relative; max-width: 560px; }
    .code { font-family: 'Cinzel Decorative', serif; font-size: clamp(5rem, 22vw, 10rem); line-height: 1; color: var(--blood-red); text-shadow: 0 0 40px rgba(218,0,0,.5); margin: 0; }
    h1 { font-family: 'Cinzel Decorative', serif; font-size: clamp(1.4rem, 5vw, 2.2rem); margin: 8px 0 14px; }
    p { color: #bbb; line-height: 1.6; margin: 0 0 28px; }
    .actions { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    a, button { font: 700 1rem 'Montserrat', sans-serif; padding: 13px 28px; border-radius: 999px; text-decoration: none; cursor: pointer; }
    .primary { background: var(--blood-red); color: #fff; border: 1px solid var(--blood-red); }
    .primary:hover { box-shadow: 0 0 20px rgba(218,0,0,.6); }
    .ghost { background: rgba(0,0,0,.5); color: #eee; border: 1px solid #555; }
    .ghost:hover { border-color: #aaa; }
  </style>
</head>
<body>
  <main>
    <p class="code" aria-hidden="true">404</p>
    <h1>Lost in the Abyss</h1>
    <p>The page you summoned does not exist. It may have been moved, or the address was mistyped.</p>
    <div class="actions">
      <a class="primary" id="home-link" href="/">Back to the Abyss</a>
      <button class="ghost" type="button" onclick="history.length > 1 ? history.back() : location.assign(document.getElementById('home-link').href)">Go back</button>
    </div>
  </main>
  <script>
    // Where is the site's home? On a custom domain it is "/". On GitHub Pages project sites
    // (https://user.github.io/my-repo/) it is the first folder of the address. If your site is the root of
    // user.github.io itself, change the next line to:  var base = '/';
    var onGithub = /\.github\.io$/.test(location.hostname);
    var base = onGithub ? '/' + (location.pathname.split('/')[1] || '') + '/' : '/';
    if (base === '//') base = '/';
    document.getElementById('home-link').href = base;
    document.body.style.backgroundImage = 'url(' + base + 'assets/ruin-banner-gray.jpg)';
  </script>
</body>
</html>
